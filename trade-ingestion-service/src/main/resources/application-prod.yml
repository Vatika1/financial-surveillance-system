spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

trade:
  simulator:
    enabled: false

kafka:
  topics:
    replication-factor: 2
    min-insync-replicas: 2

management:
  endpoint:
    health:
      show-details: never