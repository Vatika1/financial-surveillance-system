spring:
  application:
    name: eod-reconciliation-job
  profiles:
    active: local
  main:
    web-application-type: none

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: eod_reconciliation
    baseline-on-migrate: true

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: true

reconciliation:
  feed-dir: booking-feed/out
  chunk-size: 100

logging:
  level:
    root: INFO